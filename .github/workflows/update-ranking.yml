name: Update ranking master

on:
  schedule:
    - cron: "0 18 * * *"   # 毎日 AM3:00 JST (= 18:00 UTC 前日) に実行
  workflow_dispatch: {}      # 手動実行ボタンも使えるように

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch source ranking json
        run: curl -s "https://wild-bonus-8d0b.yuuya1202taiko.workers.dev/" -o source.json

      - name: Merge diff into master
        run: node scripts/merge-diff.js source.json ranking_master.json

      - name: Commit if changed
        run: |
          git config user.name "ranking-bot"
          git config user.email "actions@github.com"
          git add ranking_master.json
          git diff --cached --quiet || git commit -m "Update ranking master ($(date -u +%Y-%m-%d))"
          git push
