<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SDVX EX-Score</title>
<style>
  :root {
    --bg: #05070d;
    --bg-glow: #0d1830;
    --panel: #10141f;
    --panel-2: #161c2c;
    --border: #232b40;
    --text: #e7ecf7;
    --muted: #7a84a0;
    --row-border: rgba(255,255,255,0.04);
    --row-hover: rgba(255,255,255,0.02);
    --dim-bg: rgba(255,255,255,0.03);
    --cyan: #00e5ff;
    --magenta: #ff2e9a;
    --gold: #ffd23f;
    --nov: #6B7FE0; --adv: #FFC93C; --exh: #FF4757; --inf: #FFA6D9;
    --mxm: #8B94AC; --grv: #D2691E; --hvn: #38BDF8; --vvd: #FF5FAE;
    --xcd: #3D6FFF; --nbl: #16A34A; --ult: #D4AF37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 15% -10%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text); font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    min-height: 100vh; padding: 20px;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:18px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark {
    width:40px; height:40px; border-radius:10px; background: linear-gradient(135deg, var(--cyan), var(--magenta));
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:16px; color:#05070d;
    box-shadow: 0 0 22px rgba(0,229,255,0.35); flex-shrink:0;
  }
  .brand-title {
    font-size:20px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
  }
  .brand-title-sdvx { color:#FFD23F; }
  .brand-title-exscore { color:#FFD23F; }
  .brand-sub { font-size:11px; color:var(--muted); letter-spacing:0.5px; margin-top:2px; }
  .account-menu-wrap { position:relative; }
  .account-avatar {
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background: #4361EE; color:#ffffff;
    font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center;
  }
  .account-dropdown {
    position:absolute; top:48px; right:0; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:6px; min-width:190px; box-shadow:0 8px 24px rgba(0,0,0,0.25); z-index:60;
  }
  .account-dropdown-name { font-size:12px; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--border); margin-bottom:4px; }
  .account-dropdown-item {
    display:block; width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:9px 10px; font-size:13px; border-radius:7px; cursor:pointer;
  }
  .account-dropdown-item:hover { background:var(--panel-2); }
  .account-dropdown-item.danger { color:#ff4757; }
  .stats-row { display:flex; gap:10px; flex-wrap:wrap; }
  .stat-chip { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px 14px; min-width:78px; text-align:center; }
  .stat-chip-value { font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat-chip-label { font-size:10px; color:var(--muted); margin-top:2px; letter-spacing:0.5px; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--border); background:#232c45; border-radius:10px 10px 0 0; padding:0 6px; }
  .tab-btn {
    background:none; border:none; color:var(--muted); font-size:13px; font-weight:700; padding:10px 16px;
    cursor:pointer; letter-spacing:0.5px; position:relative; top:1px; border-bottom:2px solid transparent;
  }
  .tab-btn.active { color:var(--text); border-bottom:2px solid var(--cyan); }
  .tab-badge {
    display:inline-block; min-width:16px; height:16px; padding:0 4px; border-radius:8px;
    background:#FF4757; color:#fff; font-size:10px; font-weight:800; line-height:16px; text-align:center;
    vertical-align:2px; margin-left:2px;
  }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .panel h3 { margin:0 0 10px; font-size:14px; letter-spacing:0.5px; }
  .hint { color:var(--text); font-size:12px; margin:4px 0 10px; line-height:1.6; }
  .filter-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .search-input, .select-input { background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 10px; font-size:13px; outline:none; }
  .search-input::placeholder { color:var(--muted); opacity:0.55; }
  .search-input { flex:1; min-width:160px; }
  @media (max-width: 480px) {
    .search-input { flex-basis:100%; }
  }
  .diff-toggle-row { display:flex; gap:6px; flex-wrap:wrap; }
  .diff-toggle { border:1px solid var(--border); border-radius:7px; padding:4px 9px; font-size:11px; font-weight:700; cursor:pointer; background:var(--panel-2); color:var(--muted); }
  .diff-toggle.on { color:#05070d; }
  textarea.data-input { width:100%; min-height:110px; background:var(--panel-2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px; font-size:12px; font-family:ui-monospace,"SF Mono",monospace; resize:vertical; }
  .btn { background: linear-gradient(135deg, var(--cyan), #00a8c2); color:#05070d; border:none; border-radius:8px; padding:9px 18px; font-weight:800; font-size:13px; cursor:pointer; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn.secondary { background:var(--panel-2); color:var(--text); border:1px solid var(--border); }
  .btn.filter-active { background:var(--nov); color:#ffffff; border-color:var(--nov); font-weight:800; }
  .btn.danger { background:rgba(255,71,87,0.15); color:#ff4757; border:1px solid rgba(255,71,87,0.4); }
  .btn-row { display:flex; gap:8px; margin-top:10px; }
  .unmatched-box { margin-top:10px; font-size:11px; color:var(--muted); }
  .unmatched-box ul { margin:6px 0 0; padding-left:18px; max-height:140px; overflow:auto; }
  table.score-table { width:100%; min-width:620px; border-collapse:collapse; font-size:13px; }
  table.friend-table { width:100%; border-collapse:collapse; font-size:13px; }
  .col-title { width:260px; }
  @media (max-width: 480px) {
    table.score-table { min-width:310px; table-layout:fixed; }
    .col-title { width:150px; }
    .col-center { width:80px; padding-left:4px; padding-right:4px; }
  }
  table.score-table th, table.friend-table th {
    text-align:left; color:var(--text); font-size:11px; font-weight:700; padding:8px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:#232c45; z-index:1;
  }
  table.score-table td, table.friend-table td { padding:7px 8px; border-bottom:1px solid var(--row-border); vertical-align:middle; }
  .col-center { text-align:center; }
  table.score-table th.col-center, table.friend-table th.col-center { text-align:center; }
  table.score-table tr.unplayed { opacity:0.55; }
  table.score-table tr:hover td, table.friend-table tr:hover td { background:var(--row-hover); }
  .jacket-thumb { width:34px; height:34px; border-radius:6px; object-fit:cover; background:#1c2338; flex-shrink:0; border:2px solid var(--border); box-sizing:border-box; }
  .title-cell { display:flex; align-items:center; gap:10px; }
  .title-text { white-space:normal; word-break:break-word; line-height:1.35; min-width:0; flex:1; }
  .level-num { font-variant-numeric:tabular-nums; color:var(--text); }
  .mono { font-family:ui-monospace,"SF Mono",monospace; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:800; border:1px solid; letter-spacing:0.3px; }
  .badge-dim { color:var(--muted); background:var(--dim-bg); border-color:var(--border); }
  .empty-state { text-align:center; padding:50px 20px; color:var(--muted); }
  .empty-state .big { font-size:15px; color:var(--text); margin-bottom:6px; font-weight:700; }
  .toast {
    position:fixed; top:20px; right:20px; padding:12px 18px; border-radius:10px; font-size:13px; font-weight:600;
    z-index:150; box-shadow:0 8px 24px rgba(0,0,0,0.4); display:none;
  }
  .toast.success { background:#14261d; color:#5fe0a0; border:1px solid #5fe0a0; }
  .toast.error { background:#2a1620; color:#ff4757; border:1px solid #ff4757; }
  .show-more { text-align:center; margin-top:12px; }
  .footnote { font-size:11px; color:var(--muted); text-align:center; margin-top:18px; }

  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-box {
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    width:100%; max-width:520px; max-height:85vh; display:flex; flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .modal-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; border-bottom:1px solid var(--border);
  }
  .modal-header h3 { margin:0; font-size:15px; }
  .modal-close { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1; padding:2px 6px; }
  .modal-close:hover { color:var(--text); }
  .modal-body { padding:16px 18px; overflow-y:auto; flex:1; }
  .modal-footer { padding:14px 18px; border-top:1px solid var(--border); display:flex; justify-content:center; }
  #filterModalApplyBtn, #compareFilterApplyBtn { width:50%; min-width:200px; white-space:nowrap; }
  .filter-section { margin-bottom:18px; }
  .filter-section h4 { margin:0 0 8px; font-size:13px; color:var(--text); }
  .filter-band { margin-bottom:14px; }
  .filter-band-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .filter-band-label { font-size:12px; color:var(--muted); font-weight:700; }
  .filter-band-actions { display:flex; gap:10px; }
  .link-btn { background:none; border:none; color:var(--cyan); font-size:11px; cursor:pointer; padding:0; }
  .link-btn:hover { text-decoration:underline; }
  .check-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .check-item {
    display:flex; align-items:center; gap:5px; background:var(--panel-2); border:1px solid var(--border);
    border-radius:7px; padding:5px 9px; font-size:12px; cursor:pointer;
  }
  .check-item input { margin:0; cursor:pointer; }
  .toggle-group { display:flex; gap:8px; flex-wrap:wrap; }
  .toggle-pill {
    border:1px solid var(--border); border-radius:20px; padding:7px 16px; font-size:12px; font-weight:700;
    cursor:pointer; background:var(--panel-2); color:var(--muted);
  }
  .toggle-pill.on { background:#0e7490; border-color:#0e7490; color:#ffffff; }
  .score-range-row { display:flex; align-items:center; gap:8px; }
  .score-range-input { width:90px; text-align:center; }
  .score-range-sign { color:var(--muted); font-weight:700; }
  .input-error { border-color:#ff4757 !important; }
  .modal-footer .btn:disabled { opacity:0.4; cursor:not-allowed; }
  .badge-filled {
    display:inline-block; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:800;
    color:#ffffff; letter-spacing:0.3px;
  }
  .table-wrap { overflow-x:auto; }
</style>
</head>
<body>

<div style="max-width:360px;margin:60px auto 0;text-align:left;display:none" id="authBrand">
  <div class="brand-title" style="font-size:24px"><span class="brand-title-sdvx">SDVX</span> <span class="brand-title-exscore">EX-Score</span></div>
</div>
<div id="authGate" class="panel" style="max-width:360px;margin:16px auto;display:none">
  <h3 id="authTitle">ログイン</h3>
  <p class="hint" id="authHint">アカウント名とパスワードを入力してください。</p>
  <input class="search-input" id="authUsername" placeholder="アカウント名（半角英数字・3〜20文字）" style="width:100%;margin-bottom:8px;box-sizing:border-box;">
  <input class="search-input" id="authPassword" type="text" placeholder="パスワード（6文字以上）" style="width:100%;margin-bottom:4px;box-sizing:border-box;">
  <p class="hint" id="authError" style="color:#ff4757;min-height:16px"></p>
  <div class="btn-row">
    <button class="btn" id="authSubmitBtn" onclick="handleAuthSubmit()">ログイン</button>
    <button class="btn secondary" onclick="toggleAuthMode()">新規登録はこちら</button>
  </div>
  <details style="margin-top:14px;font-size:11px;color:var(--muted)">
    <summary style="cursor:pointer">アカウント削除・パスワードを忘れた場合</summary>
    <p style="margin:6px 0 0">X（Twitter）: <a href="https://twitter.com/yuuya1202" target="_blank" rel="noopener" style="color:#3B82F6">@yuuya1202</a> までご連絡ください。</p>
  </details>
</div>

<div id="appRoot" style="display:none">
  <div class="header">
    <div class="brand">
      <div>
        <div class="brand-title"><span class="brand-title-sdvx">SDVX</span> <span class="brand-title-exscore">EX-Score</span></div>
      </div>
    </div>
    <div class="account-menu-wrap">
      <button class="account-avatar" id="accountAvatarBtn" onclick="toggleAccountMenu()">?</button>
      <div class="account-dropdown" id="accountDropdown" style="display:none">
        <div class="account-dropdown-name" id="accountDropdownName"></div>
        <button class="account-dropdown-item" onclick="openChangeUsernameModal(); toggleAccountMenu();">アカウント名を変更</button>
        <button class="account-dropdown-item" onclick="switchTab('terms'); toggleAccountMenu();">利用規約</button>
        <button class="account-dropdown-item danger" onclick="handleLogout()">ログアウト</button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-list" onclick="switchTab('list')">ホーム</button>
    <button class="tab-btn" id="tab-compare" onclick="switchTab('compare')">スコア比較</button>
    <button class="tab-btn" id="tab-friends" onclick="switchTab('friends')">フレンド</button>
    <button class="tab-btn" id="tab-data" onclick="switchTab('data')">スコア登録</button>
  </div>

  <div id="view-list"></div>
  <div id="view-data" style="display:none"></div>
  <div id="view-terms" style="display:none"></div>
  <div id="view-friends" style="display:none"></div>
  <div id="view-compare" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="confirmModalOverlay" style="display:none">
  <div class="modal-box" style="max-width:340px">
    <div class="modal-body" id="confirmModalBody" style="padding:22px 20px 6px"></div>
    <div class="modal-footer" style="display:flex;gap:10px">
      <button class="btn" id="confirmModalOkBtn" style="flex:1">OK</button>
      <button class="btn secondary" id="confirmModalCancelBtn" style="flex:1">キャンセル</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="usernameModalOverlay" style="display:none">
  <div class="modal-box" style="max-width:360px">
    <div class="modal-header">
      <h3>アカウント名を変更</h3>
      <button class="modal-close" id="usernameModalCloseBtn">×</button>
    </div>
    <div class="modal-body">
      <p class="hint">現在のアカウント名: <span id="usernameModalCurrent"></span></p>
      <p class="hint" style="margin-top:10px">新しいアカウント名</p>
      <input class="search-input" id="usernameModalNew" placeholder="半角英数字・3〜20文字" style="width:100%;box-sizing:border-box;margin-bottom:4px;">
      <p class="hint" id="usernameModalError" style="color:#ff4757;min-height:16px"></p>
    </div>
    <div class="modal-footer" style="display:flex;gap:10px">
      <button class="btn" id="usernameModalSubmitBtn" style="flex:1">変更する</button>
      <button class="btn secondary" id="usernameModalCancelBtn" style="flex:1">キャンセル</button>
    </div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------ */
/* Constants                                                           */
/* ------------------------------------------------------------------ */
const DIFF_META = {
  novice:   { abbr: "NOV", color: "var(--nov)" },
  advanced: { abbr: "ADV", color: "var(--adv)" },
  exhaust:  { abbr: "EXH", color: "var(--exh)" },
  infinite: { abbr: "INF", color: "var(--inf)" },
  maximum:  { abbr: "MXM", color: "var(--mxm)" },
  gravity:  { abbr: "GRV", color: "var(--grv)" },
  heavenly: { abbr: "HVN", color: "var(--hvn)" },
  vivid:    { abbr: "VVD", color: "var(--vvd)" },
  exceed:   { abbr: "XCD", color: "var(--xcd)" },
  nabla:    { abbr: "NBL", color: "var(--nbl)" },
  ultimate: { abbr: "ULT", color: "var(--ult)" },
};
const DIFF_ORDER = ["novice","advanced","exhaust","infinite","maximum","gravity","heavenly","vivid","exceed","nabla","ultimate"];
const GRADE_ORDER = ["D","C","B","A","A+","AA","AA+","AAA","AAA+","S"];
const GRADE_RANK = Object.fromEntries(GRADE_ORDER.map((g,i)=>[g,i]));
const CLEAR_META = {
  "PLAYED":             { label: "PLAYED", color: "#8B93A8" },
  "COMPLETE":           { label: "CLEAR",  color: "#2DD4BF" },
  "EXCESSIVE COMPLETE": { label: "EXC",    color: "#FF8C1A" },
  "MAXXIVE COMPLETE":   { label: "MXV",    color: "#DDE1EA" },
  "ULTIMATE CHAIN":     { label: "UC",     color: "#C79BFF" },
  "PERFECT":            { label: "PUC",    color: "#FFD23F" },
};

/* ------------------------------------------------------------------ */
/* State                                                                */
/* ------------------------------------------------------------------ */
let songs = [];
let scores = {};
let scoresUpdatedAt = null;
let masterError = null;
let tab = "list";
const PAGE_SIZE = 100;
let currentPage = 1;
const SCORE_DEFAULTS = { minEx: 0, maxEx: 99999, minNormal: 0, maxNormal: 10000000 };
let filters = {
  search: "", diffs: new Set(DIFF_ORDER), levels: new Set(), sort: "exscore_desc",
  scoreMode: "ex",
  scoreMinEx: SCORE_DEFAULTS.minEx, scoreMaxEx: SCORE_DEFAULTS.maxEx,
  scoreMinNormal: SCORE_DEFAULTS.minNormal, scoreMaxNormal: SCORE_DEFAULTS.maxNormal,
};
let draftLevels = new Set();
let draftDiffs = new Set();
let friendsState = { loading: false, incoming: [], outgoing: [], friends: [] };
let compareState = {
  loadingFriends: false, friendsList: [], selectedUid: "",
  loadingScores: false, friendScores: null,
  search: "", mode: "ex", resultFilter: "all", sort: "level_desc",
  levels: new Set(), diffs: new Set(DIFF_ORDER),
};
let compareSkeletonBuilt = false;
let compareDraftLevels = new Set();
let compareDraftDiffs = new Set();

/* ------------------------------------------------------------------ */
/* Helpers                                                              */
/* ------------------------------------------------------------------ */
function songKey(title, type) { return title + "||" + String(type).toLowerCase(); }
// 公式CSVは曲名中のスペースをノーブレークスペース(U+00A0)で、
// 曲名中の実カンマを全角カンマ(，)で出力してくる仕様があるため、
// マスタ(songs.json)側の表記（半角スペース・半角カンマ）に正規化してから突合する。
function normalizeTitle(raw) {
  return String(raw).trim()
    .replace(/\u00A0/g, " ")
    .replace(/，/g, ",");
}
function fmtNum(n) { return (n === null || n === undefined || isNaN(n)) ? "-" : n.toLocaleString("en-US"); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toDate(v) {
  if (!v) return null;
  if (typeof v.toDate === "function") return v.toDate();
  if (v instanceof Date) return v;
  return null;
}
function formatDateTime(date) {
  if (!date) return "";
  const pad = (n) => String(n).padStart(2, "0");
  return `${date.getFullYear()}/${pad(date.getMonth()+1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function formatRelativeTime(date) {
  if (!date) return "";
  const diffMin = Math.floor((Date.now() - date.getTime()) / 60000);
  if (diffMin < 1) return "たった今";
  if (diffMin < 60) return `${diffMin}分前`;
  const diffHour = Math.floor(diffMin / 60);
  if (diffHour < 24) return `${diffHour}時間前`;
  const diffDay = Math.floor(diffHour / 24);
  return `${diffDay}日前`;
}

let _confirmResolve = null;
function showConfirmDialog(message) {
  return new Promise((resolve) => {
    document.getElementById('confirmModalBody').textContent = message;
    document.getElementById('confirmModalOverlay').style.display = 'flex';
    _confirmResolve = resolve;
  });
}
function _closeConfirmDialog(result) {
  document.getElementById('confirmModalOverlay').style.display = 'none';
  if (_confirmResolve) { _confirmResolve(result); _confirmResolve = null; }
}
document.addEventListener('DOMContentLoaded', () => {
  const cancelBtn = document.getElementById('confirmModalCancelBtn');
  const okBtn = document.getElementById('confirmModalOkBtn');
  const overlay = document.getElementById('confirmModalOverlay');
  if (cancelBtn) cancelBtn.addEventListener('click', () => _closeConfirmDialog(false));
  if (okBtn) okBtn.addEventListener('click', () => _closeConfirmDialog(true));
  if (overlay) overlay.addEventListener('click', (e) => { if (e.target.id === 'confirmModalOverlay') _closeConfirmDialog(false); });

  const uCloseBtn = document.getElementById('usernameModalCloseBtn');
  const uCancelBtn = document.getElementById('usernameModalCancelBtn');
  const uSubmitBtn = document.getElementById('usernameModalSubmitBtn');
  const uOverlay = document.getElementById('usernameModalOverlay');
  if (uCloseBtn) uCloseBtn.addEventListener('click', closeChangeUsernameModal);
  if (uCancelBtn) uCancelBtn.addEventListener('click', closeChangeUsernameModal);

function parseScoreCsv(text) {
  const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if (lines.length < 2) throw new Error("CSVにデータ行がありません");
  const rows = lines.slice(1);
  const records = {};
  let parsedCount = 0;
  for (const line of rows) {
    const cols = line.split(",");
    if (cols.length < 9) continue;
    const [title, diffRaw, levelRaw, clearRank, grade, highScore, exScore, playCount, clearCount] = cols;
    if (!title || !diffRaw) continue;
    const type = diffRaw.trim().toLowerCase();
    const normalizedTitle = normalizeTitle(title);
    const key = songKey(normalizedTitle, type);
    records[key] = {
      title: normalizedTitle, type,
      clearRank: (clearRank || "").trim(),
      grade: (grade || "").trim(),
      highScore: parseInt(highScore, 10) || 0,
      exScore: parseInt(exScore, 10) || 0,
      playCount: parseInt(playCount, 10) || 0,
    };
    parsedCount++;
  }
  return { records, parsedCount };
}

async function loadAll() {
  try {
    const res = await fetch('./songs.json');
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    songs = data.filter(d => d && d.title && d.type).map(d => ({
      key: d.key || songKey(d.title, d.type),
      title: String(d.title),
      type: String(d.type).toLowerCase(),
      level: typeof d.level === "number" ? d.level : parseFloat(d.level),
      jacket: d.jacket || "",
      reading: d.reading || "",
      maxExScore: Number(d.max_exscore)||0,
    }));
  } catch (e) {
    masterError = "楽曲マスタ(songs.json)の読み込みに失敗しました: " + e.message +
      "。index.html と同じフォルダに songs.json を置いてデプロイしているか確認してください。";
  }
  try {
    const result = await window.loadScoresFromFirestore();
    scores = result.scores;
    scoresUpdatedAt = result.updatedAt;
  } catch (e) {
    scores = {};
    showToast("スコアデータの読み込みに失敗しました: " + e.message, "error");
  }

  filters.levels = new Set(ALL_LEVEL_VALUES);
  compareState.levels = new Set(ALL_LEVEL_VALUES);

  render();

}

function getMerged() {
  return songs.map(s => {
    const key = songKey(s.title, s.type);
    return Object.assign({}, s, { key, score: scores[key] || null });
  });
}

function getStats(merged) {
  const total = merged.length;
  const played = merged.filter(m => m.score).length;
  const sCount = merged.filter(m => m.score && m.score.grade === "S").length;
  const pucCount = merged.filter(m => m.score && m.score.clearRank === "PERFECT").length;
  return { total, played, sCount, pucCount };
}

function exDiff(m) {
  return exDiffFor(m.score, m.maxExScore);
}
function exDiffFor(scoreObj, maxExScore) {
  if (!scoreObj || !maxExScore || !scoreObj.exScore) return null;
  return scoreObj.exScore - maxExScore;
}

function formatLevel(lv) {
  return lv >= 17 ? lv.toFixed(1) : String(lv);
}

function isScoreFilterActive() {
  if (filters.scoreMode === "ex") {
    return filters.scoreMinEx !== SCORE_DEFAULTS.minEx || filters.scoreMaxEx !== SCORE_DEFAULTS.maxEx;
  }
  return filters.scoreMinNormal !== SCORE_DEFAULTS.minNormal || filters.scoreMaxNormal !== SCORE_DEFAULTS.maxNormal;
}

function isFilterActive() {
  if (isScoreFilterActive()) return true;
  if (filters.levels.size !== ALL_LEVEL_VALUES.length) return true;
  for (const lv of ALL_LEVEL_VALUES) if (!filters.levels.has(lv)) return true;
  if (filters.diffs.size !== DIFF_ORDER.length) return true;
  for (const d of DIFF_ORDER) if (!filters.diffs.has(d)) return true;
  return false;
}

function isCompareFilterActive() {
  if (compareState.levels.size !== ALL_LEVEL_VALUES.length) return true;
  for (const lv of ALL_LEVEL_VALUES) if (!compareState.levels.has(lv)) return true;
  if (compareState.diffs.size !== DIFF_ORDER.length) return true;
  for (const d of DIFF_ORDER) if (!compareState.diffs.has(d)) return true;
  return false;
}

function getFiltered(merged) {
  let list = merged.filter(m => filters.diffs.has(m.type) && filters.levels.has(m.level));
  if (filters.search.trim()) {
    const q = filters.search.trim().toLowerCase();
    list = list.filter(m => m.title.toLowerCase().includes(q) || (m.reading || "").includes(q));
  }
  if (isScoreFilterActive()) {
    if (filters.scoreMode === "ex") {
      list = list.filter(m => {
        const d = exDiff(m);
        if (d === null) return false;
        return d >= -filters.scoreMaxEx && d <= -filters.scoreMinEx;
      });
    } else {
      list = list.filter(m => m.score && m.score.highScore >= filters.scoreMinNormal && m.score.highScore <= filters.scoreMaxNormal);
    }
  }

  const cmp = {
    level_desc: (a,b) => b.level - a.level || a.title.localeCompare(b.title),
    level_asc:  (a,b) => a.level - b.level || a.title.localeCompare(b.title),
    title_asc:  (a,b) => (a.reading||a.title).localeCompare(b.reading||b.title, "ja"),
    title_desc: (a,b) => (b.reading||b.title).localeCompare(a.reading||a.title, "ja"),
    score_desc: (a,b) => (b.score?.highScore||-1) - (a.score?.highScore||-1),
    score_asc:  (a,b) => (a.score?a.score.highScore:Infinity) - (b.score?b.score.highScore:Infinity),
    exscore_desc: (a,b) => (exDiff(b)===null?-Infinity:exDiff(b)) - (exDiff(a)===null?-Infinity:exDiff(a)),
    exscore_asc:  (a,b) => (exDiff(a)===null?Infinity:exDiff(a)) - (exDiff(b)===null?Infinity:exDiff(b)),
  }[filters.sort] || (() => 0);
  return list.slice().sort(cmp);
}

function compareResultFor(m, friendScores, mode) {
  const fs = friendScores[m.key] || null;
  let mineVal, friendVal;
  if (mode === "ex") {
    mineVal = exDiff(m);
    friendVal = exDiffFor(fs, m.maxExScore);
  } else {
    mineVal = m.score ? m.score.highScore : null;
    friendVal = fs ? fs.highScore : null;
  }
  const mineHas = mineVal !== null && mineVal !== undefined;
  const friendHas = friendVal !== null && friendVal !== undefined;
  if (!mineHas && !friendHas) return null; // どちらも未プレイ: 集計対象外
  if (mineHas && !friendHas) return "win";  // 自分だけプレイ済み
  if (!mineHas && friendHas) return "loss"; // 相手だけプレイ済み
  if (mineVal > friendVal) return "win";
  if (mineVal < friendVal) return "loss";
  return "draw";
}

function compareMineValue(m, mode) {
  if (mode === "ex") {
    const d = exDiff(m);
    return d === null ? -Infinity : d;
  }
  return m.score ? m.score.highScore : -1;
}

function getCompareFiltered(merged, friendScores) {
  let list = merged.filter(m => (m.score || friendScores[m.key]) && compareState.diffs.has(m.type) && compareState.levels.has(m.level));
  if (compareState.search.trim()) {
    const q = compareState.search.trim().toLowerCase();
    list = list.filter(m => m.title.toLowerCase().includes(q) || (m.reading || "").includes(q));
  }
  const mode = compareState.mode;
  const cmp = {
    level_desc: (a, b) => b.level - a.level || a.title.localeCompare(b.title, "ja"),
    level_asc: (a, b) => a.level - b.level || a.title.localeCompare(b.title, "ja"),
    title_asc: (a, b) => (a.reading || a.title).localeCompare(b.reading || b.title, "ja"),
    title_desc: (a, b) => (b.reading || b.title).localeCompare(a.reading || a.title, "ja"),
    score_desc: (a, b) => compareMineValue(b, mode) - compareMineValue(a, mode),
    score_asc: (a, b) => compareMineValue(a, mode) - compareMineValue(b, mode),
  }[compareState.sort] || ((a, b) => b.level - a.level || a.title.localeCompare(b.title, "ja"));
  return list.slice().sort(cmp);
}

    return;

        <select class="select-input" onchange="handleSelectCompareFriend(this.value)">${options}</select>

  updateCompareTableBody();
}

function updateCompareTableBody() {
  const merged = getMerged();
  const { friendScores, mode, resultFilter } = compareState;
  const filtered = getCompareFiltered(merged, friendScores);

  let win = 0, loss = 0, draw = 0;
  const withResult = filtered.map(m => ({ m, result: compareResultFor(m, friendScores, mode) }));
  withResult.forEach(({ result }) => {
    if (result === "win") win++;
    else if (result === "loss") loss++;
    else if (result === "draw") draw++;
  });

  const visible = resultFilter === "all" ? withResult : withResult.filter(r => r.result === resultFilter);

  const rows = visible.map(({ m, result }) => {
    const fs = friendScores[m.key] || null;
    const meta = DIFF_META[m.type] || { abbr: (m.type || "?").slice(0, 3).toUpperCase(), color: "#888" };
    const mineDisplay = mode === "ex"
      ? (exDiff(m) === null ? "-" : String(exDiff(m)))
      : (m.score ? fmtNum(m.score.highScore) : "-");
    const friendDisplay = mode === "ex"
      ? (exDiffFor(fs, m.maxExScore) === null ? "-" : String(exDiffFor(fs, m.maxExScore)))
      : (fs ? fmtNum(fs.highScore) : "-");
    const mineColor = result === "win" ? "color:#3B82F6" : "";
    const friendColor = result === "loss" ? "color:#FF4757" : "";
    return `<tr>
      <td><div class="title-cell">${m.jacket?`<img class="jacket-thumb" src="${esc(m.jacket)}" loading="lazy" style="border-color:${meta.color}">`:`<div class="jacket-thumb" style="border-color:${meta.color}"></div>`}<span class="title-text">${esc(m.title)}</span></div></td>
      <td class="mono col-center" style="${mineColor}">${mineDisplay}</td>
      <td class="mono col-center" style="${friendColor}">${friendDisplay}</td>
    </tr>`;
  }).join("");

  document.getElementById('compareTbody').innerHTML = rows;
  document.getElementById('compareEmptyState').innerHTML = visible.length === 0
    ? `<div class="empty-state">比較できるスコアがありません</div>` : "";
  document.getElementById('compareTally').innerHTML = `<span style="font-size:17px;font-weight:700;color:var(--text)">${win}勝${loss}敗${draw}分け</span>`;
}

function buildDecimalRange(start, end, step) {
  const out = [];
  for (let v = start; v <= end + 1e-9; v += step) out.push(Math.round(v * 10) / 10);
  return out;
}

function normalizeScoreInput(raw, fallback, cap) {
  let n = parseInt(String(raw).replace(/[^0-9]/g, ""), 10);

  if (cap !== undefined && n > cap) n = cap;
  return n;
}

          <button class="link-btn" onclick='setAllDiffs(${JSON.stringify(diffList)}, true)'>全選択</button>
          <button class="link-btn" onclick='setAllDiffs(${JSON.stringify(diffList)}, false)'>解除</button>
        </span>
      </div>
      <div class="check-grid">${diffChecksHtml}</div>
    </div>
  `;
  const applyBtn = document.getElementById('filterModalApplyBtn');
  if (applyBtn) applyBtn.disabled = scoreRangeInvalid;
}
window.openFilterModal = openFilterModal;
window.closeFilterModal = closeFilterModal;
window.applyFilterModal = applyFilterModal;

function renderListTab(merged) {
  if (songs.length === 0) {
    document.getElementById('view-list').innerHTML = `
      <div class="empty-state">
        <div class="big">楽曲マスタデータを読み込めませんでした</div>
        <div>${esc(masterError || "songs.json を確認してください。")}</div>
      </div>`;
    listSkeletonBuilt = false;
    return;
  }

  const filtered = getFiltered(merged);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;
  const start = (currentPage - 1) * PAGE_SIZE;
  const visible = filtered.slice(start, start + PAGE_SIZE);

  if (!listSkeletonBuilt) {
    buildListSkeleton();
    listSkeletonBuilt = true;
  }
  updateListControls();
  updateListTableBody(visible, filtered, merged, totalPages);
}

/* loadAll() はログイン確認後、下部のFirebase用scriptから呼び出す */
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, serverTimestamp,
  collection, query, where, getDocs, updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYjKFgJljrrbrDi0xbTdJxH4p7HobDznw",
  authDomain: "ex-score-tool.firebaseapp.com",
  projectId: "ex-score-tool",
  storageBucket: "ex-score-tool.firebasestorage.app",
  messagingSenderId: "941719335618",
  appId: "1:941719335618:web:b602dfe45701dec852c15b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const FAKE_EMAIL_SUFFIX = "@voltlog.local";
function usernameToEmail(username) {
  return username.trim().toLowerCase() + FAKE_EMAIL_SUFFIX;
}
function validateUsername(u) {
  return /^[a-zA-Z0-9_]{3,20}$/.test(u);
}
function mapAuthError(e) {
  switch (e.code) {
    case "auth/email-already-in-use": return "そのアカウント名は既に使われています";
    case "auth/weak-password": return "パスワードは6文字以上にしてください";
    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found": return "アカウント名またはパスワードが違います";
    case "auth/invalid-email": return "アカウント名に使える文字を確認してください";
    default: return "エラーが発生しました: " + e.message;
  }
}

let authMode = "login";
function renderAuthGate() {
  document.getElementById('authTitle').textContent = authMode === "login" ? "ログイン" : "新規登録";
  document.getElementById('authSubmitBtn').textContent = authMode === "login" ? "ログイン" : "登録する";
  document.querySelector('#authGate .btn.secondary').textContent = authMode === "login" ? "新規登録はこちら" : "戻る";
  document.getElementById('authError').textContent = "";
}
window.toggleAuthMode = function () {
  authMode = authMode === "login" ? "signup" : "login";
  renderAuthGate();
};

window.handleAuthSubmit = async function () {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = "";

  if (!validateUsername(username)) {
    errEl.textContent = "アカウント名は半角英数字とアンダースコアで3〜20文字にしてください";
    return;
  }
  if (!password || password.length < 6) {
    errEl.textContent = "パスワードは6文字以上で入力してください";
    return;
  }

  const email = usernameToEmail(username);
  try {
    if (authMode === "signup") {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, "users", cred.user.uid), {
        username, displayName: username, createdAt: serverTimestamp(), scores: {}
      });
      await setDoc(doc(db, "usernames", username.toLowerCase()), { uid: cred.user.uid });
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (e) {
    errEl.textContent = mapAuthError(e);
  }
};

window.handleLogout = async function () {
  if (!(await window.showConfirmDialog("ログアウトしますか？"))) return;
  signOut(auth);
};

window.changeDisplayName = async function (newNameRaw) {
  if (!auth.currentUser) throw new Error("ログインしていません");
  const newName = newNameRaw.trim();
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(newName)) {
    throw new Error("アカウント名は半角英数字とアンダースコアで3〜20文字にしてください");
  }

  const myUid = auth.currentUser.uid;
  const mySnap = await getDoc(doc(db, "users", myUid));
  const oldName = mySnap.exists() ? (mySnap.data().displayName || mySnap.data().username || "") : "";
  if (newName.toLowerCase() === oldName.toLowerCase()) {
    throw new Error("現在と同じアカウント名です");
  }

  try {
    await setDoc(doc(db, "usernames", newName.toLowerCase()), { uid: myUid });
  } catch (e) {
    throw new Error("そのアカウント名は既に使われています");
  }

  await setDoc(doc(db, "users", myUid), { displayName: newName }, { merge: true });
  try {
    await deleteDoc(doc(db, "usernames", oldName.toLowerCase()));
  } catch (e) {
    console.error("旧アカウント名の削除に失敗:", e);
  }

  return newName;
};

window.saveScoresToFirestore = async function (scores) {
  if (!auth.currentUser) throw new Error("ログインしていません");
  await setDoc(doc(db, "users", auth.currentUser.uid), { scores, scoresUpdatedAt: serverTimestamp() }, { merge: true });
};

window.loadScoresFromFirestore = async function () {
  if (!auth.currentUser) return { scores: {}, updatedAt: null };
  const snap = await getDoc(doc(db, "users", auth.currentUser.uid));
  if (!snap.exists()) return { scores: {}, updatedAt: null };
  const data = snap.data();
  const updatedAt = (data.scoresUpdatedAt && typeof data.scoresUpdatedAt.toDate === "function")
    ? data.scoresUpdatedAt.toDate() : null;
  return { scores: data.scores || {}, updatedAt };
};

function sortedId(a, b) {
  return a < b ? a + "_" + b : b + "_" + a;
}

window.sendFriendRequest = async function (targetUsernameRaw) {
  if (!auth.currentUser) throw new Error("ログインしていません");
  const myUid = auth.currentUser.uid;
  const targetUsername = targetUsernameRaw.trim().toLowerCase();
  if (!targetUsername) throw new Error("ユーザー名を入力してください");

  const mySnap = await getDoc(doc(db, "users", myUid));
  const myUsername = mySnap.exists() ? (mySnap.data().displayName || mySnap.data().username) : "";
  if (targetUsername === (myUsername || "").toLowerCase()) {
    throw new Error("自分自身には申請できません");
  }

  const unameSnap = await getDoc(doc(db, "usernames", targetUsername));
  if (!unameSnap.exists()) throw new Error("そのアカウント名は見つかりません");
  const targetUid = unameSnap.data().uid;

  const id = sortedId(myUid, targetUid);
  const reqRef = doc(db, "friendRequests", id);
  const payload = {
    fromUid: myUid,
    toUid: targetUid,
    fromUsername: myUsername,
    toUsername: targetUsernameRaw.trim(),
    status: "pending",
    createdAt: serverTimestamp(),
  };

  try {
    await setDoc(reqRef, payload);
    return;
  } catch (e) {
    if (e.code !== "permission-denied") throw e;
  }

  // 既に関係が存在する場合: 自分が送った申請が過去に拒否されていれば出し直せる
  try {
    await updateDoc(reqRef, { status: "pending", createdAt: serverTimestamp() });
  } catch (e2) {
    throw new Error("すでに申請済み、フレンド、または相手から拒否されたばかりで再申請できない状態です");
  }
};

window.getIncomingFriendRequests = async function () {
  const myUid = auth.currentUser.uid;
  const q = query(collection(db, "friendRequests"), where("toUid", "==", myUid), where("status", "==", "pending"));
  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
};

window.getOutgoingFriendRequests = async function () {
  const myUid = auth.currentUser.uid;
  const q = query(collection(db, "friendRequests"), where("fromUid", "==", myUid), where("status", "==", "pending"));
  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
};

window.getFriends = async function () {
  const myUid = auth.currentUser.uid;
  const q1 = query(collection(db, "friendRequests"), where("fromUid", "==", myUid), where("status", "==", "accepted"));
  const q2 = query(collection(db, "friendRequests"), where("toUid", "==", myUid), where("status", "==", "accepted"));
  const [s1, s2] = await Promise.all([getDocs(q1), getDocs(q2)]);
  const uids = [];
  s1.forEach(d => uids.push(d.data().toUid));
  s2.forEach(d => uids.push(d.data().fromUid));
  const friends = await Promise.all(uids.map(async (uid) => {
    try {
      const snap = await getDoc(doc(db, "users", uid));
      const data = snap.exists() ? snap.data() : {};
      return { uid, username: data.displayName || data.username || "" };
    } catch (e) {
      return { uid, username: "" };
    }
  }));
  return friends;
};

window.respondFriendRequest = async function (id, accept) {
  const reqRef = doc(db, "friendRequests", id);
  await updateDoc(reqRef, { status: accept ? "accepted" : "rejected" });
};

window.removeFriend = async function (otherUid) {
  if (!auth.currentUser) throw new Error("ログインしていません");
  const id = sortedId(auth.currentUser.uid, otherUid);
  await deleteDoc(doc(db, "friendRequests", id));
};

window.getUserScores = async function (uid) {
  const snap = await getDoc(doc(db, "users", uid));
  return snap.exists() ? (snap.data().scores || {}) : {};
};

onAuthStateChanged(auth, async (user) => {
  if (user) {
    let username = "";
    try {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) {
        username = snap.data().displayName || snap.data().username || "";
      }
    } catch (e) {
      console.error("ユーザー情報の取得に失敗:", e);
    }
    document.getElementById('authGate').style.display = 'none';
    document.getElementById('authBrand').style.display = 'none';
    document.getElementById('appRoot').style.display = 'block';
    document.getElementById('accountDropdownName').textContent = username ? (username + " でログイン中") : "";
    window.currentUsername = username;
    document.getElementById('accountAvatarBtn').textContent = username ? username.charAt(0).toUpperCase() : "?";
    window.loadAll();
  } else {
    document.getElementById('appRoot').style.display = 'none';
    document.getElementById('authGate').style.display = 'block';
    document.getElementById('authBrand').style.display = 'block';
  }
});

renderAuthGate();
</script>
</body>
</html>
