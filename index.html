<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>VOLT LOG - SDVX Score Tracker</title>
<style>
  :root {
    --bg: #05070d;
    --panel: #10141f;
    --panel-2: #161c2c;
    --border: #232b40;
    --text: #e7ecf7;
    --muted: #7a84a0;
    --cyan: #00e5ff;
    --magenta: #ff2e9a;
    --gold: #ffd23f;
    --nov: #B65CFF; --adv: #FFC93C; --exh: #FF4757; --inf: #E0A9FF;
    --mxm: #9AA5C0; --grv: #FFD23F; --hvn: #4FC3F7; --vvd: #FF6EC9;
    --xcd: #4361EE; --nbl: #00E5FF; --ult: #FF2E9A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 15% -10%, #0d1830 0%, var(--bg) 55%);
    color: var(--text); font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    min-height: 100vh; padding: 20px;
  }
  .header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:18px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark {
    width:40px; height:40px; border-radius:10px; background: linear-gradient(135deg, var(--cyan), var(--magenta));
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:16px; color:#05070d;
    box-shadow: 0 0 22px rgba(0,229,255,0.35); flex-shrink:0;
  }
  .brand-title {
    font-size:20px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
    background: linear-gradient(90deg, var(--cyan), var(--magenta)); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand-sub { font-size:11px; color:var(--muted); letter-spacing:0.5px; margin-top:2px; }
  .stats-row { display:flex; gap:10px; flex-wrap:wrap; }
  .stat-chip { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px 14px; min-width:78px; text-align:center; }
  .stat-chip-value { font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat-chip-label { font-size:10px; color:var(--muted); margin-top:2px; letter-spacing:0.5px; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--border); }
  .tab-btn {
    background:none; border:none; color:var(--muted); font-size:13px; font-weight:700; padding:10px 16px;
    cursor:pointer; letter-spacing:0.5px; position:relative; top:1px; border-bottom:2px solid transparent;
  }
  .tab-btn.active { color:var(--text); border-bottom:2px solid var(--cyan); }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .panel h3 { margin:0 0 10px; font-size:14px; letter-spacing:0.5px; }
  .hint { color:var(--muted); font-size:12px; margin:4px 0 10px; line-height:1.6; }
  .filter-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .search-input, .select-input { background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 10px; font-size:13px; outline:none; }
  .search-input { flex:1; min-width:160px; }
  .diff-toggle-row { display:flex; gap:6px; flex-wrap:wrap; }
  .diff-toggle { border:1px solid var(--border); border-radius:7px; padding:4px 9px; font-size:11px; font-weight:700; cursor:pointer; background:var(--panel-2); color:var(--muted); }
  .diff-toggle.on { color:#05070d; }
  textarea.data-input { width:100%; min-height:110px; background:var(--panel-2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px; font-size:12px; font-family:ui-monospace,"SF Mono",monospace; resize:vertical; }
  .btn { background: linear-gradient(135deg, var(--cyan), #00a8c2); color:#05070d; border:none; border-radius:8px; padding:9px 18px; font-weight:800; font-size:13px; cursor:pointer; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn.secondary { background:var(--panel-2); color:var(--text); border:1px solid var(--border); }
  .btn.danger { background:rgba(255,71,87,0.15); color:#ff4757; border:1px solid rgba(255,71,87,0.4); }
  .btn-row { display:flex; gap:8px; margin-top:10px; }
  .unmatched-box { margin-top:10px; font-size:11px; color:var(--muted); }
  .unmatched-box ul { margin:6px 0 0; padding-left:18px; max-height:140px; overflow:auto; }
  table.score-table { width:100%; border-collapse:collapse; font-size:13px; }
  table.score-table th {
    text-align:left; color:var(--muted); font-size:11px; font-weight:700; padding:8px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--panel); z-index:1;
  }
  table.score-table td { padding:7px 8px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle; }
  table.score-table tr.unplayed { opacity:0.55; }
  table.score-table tr:hover td { background:rgba(255,255,255,0.02); }
  .jacket-thumb { width:34px; height:34px; border-radius:6px; object-fit:cover; background:#1c2338; flex-shrink:0; }
  .title-cell { display:flex; align-items:center; gap:10px; max-width:340px; }
  .title-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .level-num { font-variant-numeric:tabular-nums; font-weight:700; color:var(--muted); }
  .mono { font-family:ui-monospace,"SF Mono",monospace; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:800; border:1px solid; letter-spacing:0.3px; }
  .badge-dim { color:var(--muted); background:rgba(255,255,255,0.03); border-color:var(--border); }
  .empty-state { text-align:center; padding:50px 20px; color:var(--muted); }
  .empty-state .big { font-size:15px; color:var(--text); margin-bottom:6px; font-weight:700; }
  .toast {
    position:fixed; bottom:20px; right:20px; padding:12px 18px; border-radius:10px; font-size:13px; font-weight:600;
    z-index:50; box-shadow:0 8px 24px rgba(0,0,0,0.4); display:none;
  }
  .toast.success { background:#14261d; color:#5fe0a0; border:1px solid #5fe0a0; }
  .toast.error { background:#2a1620; color:#ff4757; border:1px solid #ff4757; }
  .show-more { text-align:center; margin-top:12px; }
  .footnote { font-size:11px; color:var(--muted); text-align:center; margin-top:18px; }
  .table-wrap { max-height:58vh; overflow:auto; }
</style>
</head>
<body>

<div id="authGate" class="panel" style="max-width:360px;margin:60px auto;display:none">
  <h3 id="authTitle">ログイン</h3>
  <p class="hint" id="authHint">アカウント名とパスワードを入力してください。</p>
  <input class="search-input" id="authUsername" placeholder="アカウント名（半角英数字・3〜20文字）" style="width:100%;margin-bottom:8px;box-sizing:border-box;">
  <input class="search-input" id="authPassword" type="password" placeholder="パスワード（6文字以上）" style="width:100%;margin-bottom:4px;box-sizing:border-box;">
  <p class="hint" id="authError" style="color:#ff4757;min-height:16px"></p>
  <div class="btn-row">
    <button class="btn" id="authSubmitBtn" onclick="handleAuthSubmit()">ログイン</button>
    <button class="btn secondary" onclick="toggleAuthMode()">新規登録はこちら</button>
  </div>
</div>

<div id="appRoot" style="display:none">
  <div class="header">
    <div class="brand">
      <div class="brand-mark">V</div>
      <div>
        <div class="brand-title">VOLT LOG</div>
        <div class="brand-sub">SOUND VOLTEX SCORE TRACKER</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div class="stats-row" id="statsRow"></div>
      <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)">
        <span id="authUserLabel"></span>
        <button class="btn secondary" style="padding:6px 12px;font-size:11px" onclick="handleLogout()">ログアウト</button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-list" onclick="switchTab('list')">スコア一覧</button>
    <button class="tab-btn" id="tab-data" onclick="switchTab('data')">データ管理</button>
  </div>

  <div id="view-list"></div>
  <div id="view-data" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ------------------------------------------------------------------ */
/* Constants                                                           */
/* ------------------------------------------------------------------ */
const DIFF_META = {
  novice:   { abbr: "NOV", color: "var(--nov)" },
  advanced: { abbr: "ADV", color: "var(--adv)" },
  exhaust:  { abbr: "EXH", color: "var(--exh)" },
  infinite: { abbr: "INF", color: "var(--inf)" },
  maximum:  { abbr: "MXM", color: "var(--mxm)" },
  gravity:  { abbr: "GRV", color: "var(--grv)" },
  heavenly: { abbr: "HVN", color: "var(--hvn)" },
  vivid:    { abbr: "VVD", color: "var(--vvd)" },
  exceed:   { abbr: "XCD", color: "var(--xcd)" },
  nabla:    { abbr: "NBL", color: "var(--nbl)" },
  ultimate: { abbr: "ULT", color: "var(--ult)" },
};
const DIFF_ORDER = ["novice","advanced","exhaust","infinite","maximum","gravity","heavenly","vivid","exceed","nabla","ultimate"];
const GRADE_ORDER = ["D","C","B","A","A+","AA","AA+","AAA","AAA+","S"];
const GRADE_RANK = Object.fromEntries(GRADE_ORDER.map((g,i)=>[g,i]));
const CLEAR_META = {
  "PLAYED":             { label: "PLAYED", color: "#8B93A8" },
  "COMPLETE":           { label: "CLEAR",  color: "#5EC8FF" },
  "EXCESSIVE COMPLETE": { label: "EXC",    color: "#5FE0A0" },
  "MAXXIVE COMPLETE":   { label: "MXC",    color: "#2FE6C8" },
  "ULTIMATE CHAIN":     { label: "UC",     color: "#C79BFF" },
  "PERFECT":            { label: "PUC",    color: "#FFD23F" },
};

/* ------------------------------------------------------------------ */
/* State                                                                */
/* ------------------------------------------------------------------ */
let songs = [];
let scores = {};
let masterError = null;
let tab = "list";
let visibleCount = 200;
let filters = { search: "", diffs: new Set(DIFF_ORDER), levelMin: null, levelMax: null, status: "all", sort: "level_desc" };

/* ------------------------------------------------------------------ */
/* Helpers                                                              */
/* ------------------------------------------------------------------ */
function songKey(title, type) { return title + "||" + String(type).toLowerCase(); }
// 公式CSVは曲名中のスペースをノーブレークスペース(U+00A0)で、
// 曲名中の実カンマを全角カンマ(，)で出力してくる仕様があるため、
// マスタ(songs.json)側の表記（半角スペース・半角カンマ）に正規化してから突合する。
function normalizeTitle(raw) {
  return String(raw).trim()
    .replace(/\u00A0/g, " ")
    .replace(/，/g, ",");
}
function fmtNum(n) { return (n === null || n === undefined || isNaN(n)) ? "-" : n.toLocaleString("en-US"); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function showToast(msg, kind) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + kind;
  el.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { el.style.display = 'none'; }, 3200);
}

function parseScoreCsv(text) {
  const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if (lines.length < 2) throw new Error("CSVにデータ行がありません");
  const rows = lines.slice(1);
  const records = {};
  let parsedCount = 0;
  for (const line of rows) {
    const cols = line.split(",");
    if (cols.length < 9) continue;
    const [title, diffRaw, levelRaw, clearRank, grade, highScore, exScore, playCount, clearCount] = cols;
    if (!title || !diffRaw) continue;
    const type = diffRaw.trim().toLowerCase();
    const normalizedTitle = normalizeTitle(title);
    const key = songKey(normalizedTitle, type);
    records[key] = {
      title: normalizedTitle, type,
      clearRank: (clearRank || "").trim(),
      grade: (grade || "").trim(),
      highScore: parseInt(highScore, 10) || 0,
      exScore: parseInt(exScore, 10) || 0,
      playCount: parseInt(playCount, 10) || 0,
    };
    parsedCount++;
  }
  return { records, parsedCount };
}

/* ------------------------------------------------------------------ */
/* Data loading                                                         */
/* ------------------------------------------------------------------ */
async function loadAll() {
  try {
    const res = await fetch('./songs.json');
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    songs = data.filter(d => d && d.title && d.type).map(d => ({
      key: d.key || songKey(d.title, d.type),
      title: String(d.title),
      type: String(d.type).toLowerCase(),
      level: typeof d.level === "number" ? d.level : parseFloat(d.level),
      jacket: d.jacket || "",
      reading: d.reading || "",
      maxExScore: Number(d.max_exscore)||0,
    }));
  } catch (e) {
    masterError = "楽曲マスタ(songs.json)の読み込みに失敗しました: " + e.message +
      "。index.html と同じフォルダに songs.json を置いてデプロイしているか確認してください。";
  }
  try {
    scores = await window.loadScoresFromFirestore();
  } catch (e) {
    scores = {};
    showToast("スコアデータの読み込みに失敗しました: " + e.message, "error");
  }

  const bounds = distinctLevels();
  if (bounds.length) { filters.levelMin = bounds[0]; filters.levelMax = bounds[bounds.length - 1]; }

  render();
}

function distinctLevels() {
  return Array.from(new Set(songs.map(s => s.level).filter(n => !isNaN(n)))).sort((a,b) => a - b);
}

/* ------------------------------------------------------------------ */
/* Actions                                                              */
/* ------------------------------------------------------------------ */
function switchTab(t) {
  tab = t;
  document.getElementById('tab-list').className = 'tab-btn' + (t === 'list' ? ' active' : '');
  document.getElementById('tab-data').className = 'tab-btn' + (t === 'data' ? ' active' : '');
  document.getElementById('view-list').style.display = t === 'list' ? 'block' : 'none';
  document.getElementById('view-data').style.display = t === 'data' ? 'block' : 'none';
  render();
}

async function handleImportCsv() {
  const ta = document.getElementById('csvInput');
  const text = ta.value;
  if (!text.trim()) { showToast("CSVを貼り付けてください", "error"); return; }
  try {
    const { records, parsedCount } = parseScoreCsv(text);
    const masterKeys = new Set(songs.map(s => songKey(s.title, s.type)));
    let matched = 0, unmatched = 0;
    const unmatchedTitles = [];
    for (const key of Object.keys(records)) {
      if (masterKeys.has(key)) matched++;
      else { unmatched++; if (unmatchedTitles.length < 30) unmatchedTitles.push(records[key].title + " / " + records[key].type); }
    }
    const merged = Object.assign({}, scores, records);
    await window.saveScoresToFirestore(merged);
    scores = merged;
    ta.value = "";
    showToast(`スコアを取り込みました（${parsedCount}件, マスタ一致 ${matched}件）`, "success");
    window._lastImportInfo = { parsedCount, matched, unmatched, unmatchedTitles };
    render();
  } catch (e) {
    showToast("取り込みに失敗しました: " + e.message, "error");
  }
}

async function handleClearScores() {
  if (!confirm("自分のスコアデータを全て削除しますか？この操作は取り消せません。")) return;
  try {
    await window.saveScoresToFirestore({});
    scores = {};
    showToast("スコアデータを削除しました", "success");
    render();
  } catch (e) {
    showToast("削除に失敗しました: " + e.message, "error");
  }
}

function toggleDiff(type) {
  if (filters.diffs.has(type)) filters.diffs.delete(type); else filters.diffs.add(type);
  render();
}

function updateFilter(key, value) {
  filters[key] = value;
  if (key === 'levelMin' || key === 'levelMax') filters[key] = parseFloat(value);
  render();
}

function showMore() { visibleCount += 200; render(); }

/* ------------------------------------------------------------------ */
/* Derived data                                                         */
/* ------------------------------------------------------------------ */
function getMerged() {
  return songs.map(s => {
    const key = songKey(s.title, s.type);
    return Object.assign({}, s, { key, score: scores[key] || null });
  });
}

function getStats(merged) {
  const total = merged.length;
  const played = merged.filter(m => m.score).length;
  const sCount = merged.filter(m => m.score && m.score.grade === "S").length;
  const pucCount = merged.filter(m => m.score && m.score.clearRank === "PERFECT").length;
  return { total, played, sCount, pucCount };
}

function getFiltered(merged) {
  let list = merged.filter(m => filters.diffs.has(m.type));
  if (filters.levelMin !== null && filters.levelMax !== null) {
    list = list.filter(m => m.level >= filters.levelMin && m.level <= filters.levelMax);
  }
  if (filters.search.trim()) {
    const q = filters.search.trim().toLowerCase();
    list = list.filter(m => m.title.toLowerCase().includes(q) || (m.reading || "").includes(q));
  }
  if (filters.status === "unplayed") list = list.filter(m => !m.score);
  else if (filters.status === "played") list = list.filter(m => !!m.score);
  else if (filters.status === "not_aaa") list = list.filter(m => !m.score || GRADE_RANK[m.score.grade] < GRADE_RANK["AAA"]);
  else if (filters.status === "not_s") list = list.filter(m => !m.score || m.score.grade !== "S");
  else if (filters.status === "not_puc") list = list.filter(m => !m.score || m.score.clearRank !== "PERFECT");

  const cmp = {
    level_desc: (a,b) => b.level - a.level || a.title.localeCompare(b.title),
    level_asc:  (a,b) => a.level - b.level || a.title.localeCompare(b.title),
    title_asc:  (a,b) => (a.reading||a.title).localeCompare(b.reading||b.title, "ja"),
    score_desc: (a,b) => (b.score?.highScore||-1) - (a.score?.highScore||-1),
    score_asc:  (a,b) => (a.score?a.score.highScore:Infinity) - (b.score?b.score.highScore:Infinity),
  }[filters.sort] || (() => 0);
  return list.slice().sort(cmp);
}

/* ------------------------------------------------------------------ */
/* Rendering                                                            */
/* ------------------------------------------------------------------ */
function render() {
  const merged = getMerged();
  const stats = getStats(merged);

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-chip"><div class="stat-chip-value">${fmtNum(stats.total)}</div><div class="stat-chip-label">登録曲数</div></div>
    <div class="stat-chip"><div class="stat-chip-value" style="color:#5EC8FF">${fmtNum(stats.played)}</div><div class="stat-chip-label">プレー済</div></div>
    <div class="stat-chip"><div class="stat-chip-value" style="color:#FFD23F">${fmtNum(stats.sCount)}</div><div class="stat-chip-label">S</div></div>
    <div class="stat-chip"><div class="stat-chip-value" style="color:#C79BFF">${fmtNum(stats.pucCount)}</div><div class="stat-chip-label">PUC</div></div>
  `;

  if (tab === 'data') {
    renderDataTab();
  } else {
    renderListTab(merged);
  }
}

function renderDataTab() {
  const info = window._lastImportInfo;
  document.getElementById('view-data').innerHTML = `
    ${masterError ? `<div class="panel"><h3 style="color:#ff4757">⚠ マスタ読み込みエラー</h3><p class="hint">${esc(masterError)}</p></div>` : ""}
    <div class="panel">
      <h3>楽曲マスタデータについて</h3>
      <p class="hint">
        楽曲マスタ（songs.json）はこの index.html とは別ファイルとして同じフォルダに置かれています。
        新曲追加時は songs.json だけを更新すれば、この画面のコードは変更不要です。
        現在 <b>${songs.length}</b> 譜面を読み込み済みです。
      </p>
    </div>
    <div class="panel">
      <h3>スコアCSVの取り込み</h3>
      <p class="hint">公式アプリから書き出したスコアCSVを貼り付けてください。1行目のヘッダーは無視されます。取り込んだスコアはあなたのアカウントに紐づけてクラウド（Firestore）に保存されるため、別の端末からログインしても同じデータが見られます。</p>
      <textarea class="data-input" id="csvInput" placeholder="楽曲名,難易度,楽曲レベル,クリアランク,スコアグレード,ハイスコア,..."></textarea>
      <div class="btn-row">
        <button class="btn" onclick="handleImportCsv()">CSVを取り込む</button>
        ${Object.keys(scores).length > 0 ? `<button class="btn danger" onclick="handleClearScores()">自分のスコアを全削除</button>` : ""}
      </div>
      ${info ? `
        <div class="unmatched-box">
          取り込み ${info.parsedCount}件 / マスタ一致 ${info.matched}件 / 未一致 ${info.unmatched}件
          ${info.unmatchedTitles.length ? `<div>未一致の例:</div><ul>${info.unmatchedTitles.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>` : ""}
        </div>` : ""}
    </div>
  `;
}

function renderListTab(merged) {
  if (songs.length === 0) {
    document.getElementById('view-list').innerHTML = `
      <div class="empty-state">
        <div class="big">楽曲マスタデータを読み込めませんでした</div>
        <div>${esc(masterError || "songs.json を確認してください。")}</div>
      </div>`;
    return;
  }

  const filtered = getFiltered(merged);
  const visible = filtered.slice(0, visibleCount);
  const levels = distinctLevels();

  const diffChips = DIFF_ORDER.filter(d => songs.some(s => s.type === d)).map(d => {
    const meta = DIFF_META[d];
    const on = filters.diffs.has(d);
    return `<button class="diff-toggle ${on?'on':''}" style="${on?`background:${meta.color};border-color:${meta.color}`:''}" onclick="toggleDiff('${d}')">${meta.abbr}</button>`;
  }).join("");

  const levelOptions = levels.map(lv => `<option value="${lv}">${lv}</option>`).join("");

  const rows = visible.map(m => {
    const meta = DIFF_META[m.type] || { abbr: (m.type||"?").slice(0,3).toUpperCase(), color: "#888" };
    const gradeInfo = m.score ? (() => {
      const isTop = m.score.grade === "S";
      const isHigh = GRADE_RANK[m.score.grade] >= GRADE_RANK["AAA"];
      return isTop ? "#FFD23F" : isHigh ? "#5FE0A0" : "#8B93A8";
    })() : null;
    const clearMeta = m.score ? CLEAR_META[m.score.clearRank] : null;
    return `
      <tr class="${!m.score?'unplayed':''}">
        <td><div class="title-cell">${m.jacket?`<img class="jacket-thumb" src="${esc(m.jacket)}" loading="lazy">`:`<div class="jacket-thumb"></div>`}<span class="title-text">${esc(m.title)}</span></div></td>
        <td><span class="badge" style="color:${meta.color};background:${meta.color}22;border-color:${meta.color}55">${meta.abbr}</span></td>
        <td class="level-num">${m.level}</td>
        <td>${clearMeta ? `<span class="badge" style="color:${clearMeta.color};background:${clearMeta.color}22;border-color:${clearMeta.color}55">${clearMeta.label}</span>` : `<span class="badge badge-dim">未プレイ</span>`}</td>
        <td class="mono">${m.score?fmtNum(m.score.highScore):"-"}</td>
        <td class="mono">${(() => {
const diff=(m.score&&m.maxExScore)?(m.score.exScore-m.maxExScore):null;
return diff===null?"-":String(diff);
})()}</td>
      </tr>`;
  }).join("");

  document.getElementById('view-list').innerHTML = `
    <div class="panel">
      <div class="filter-bar">
        <input class="search-input" placeholder="曲名で検索…" value="${esc(filters.search)}" oninput="updateFilter('search', this.value)">
        <select class="select-input" onchange="updateFilter('levelMin', this.value)">${levelOptions.replace(`value="${filters.levelMin}"`, `value="${filters.levelMin}" selected`)}</select>
        <span style="color:var(--muted);font-size:12px">〜</span>
        <select class="select-input" onchange="updateFilter('levelMax', this.value)">${levelOptions.replace(`value="${filters.levelMax}"`, `value="${filters.levelMax}" selected`)}</select>
        <select class="select-input" onchange="updateFilter('status', this.value)">
          <option value="all">すべて</option>
          <option value="played">プレー済のみ</option>
          <option value="unplayed">未プレイのみ</option>
          <option value="not_aaa">未AAA</option>
          <option value="not_s">未S</option>
          <option value="not_puc">未PUC</option>
        </select>
        <select class="select-input" onchange="updateFilter('sort', this.value)">
          <option value="level_desc">レベル高い順</option>
          <option value="level_asc">レベル低い順</option>
          <option value="title_asc">曲名順</option>
          <option value="score_desc">スコア高い順</option>
          <option value="score_asc">スコア低い順</option>
        </select>
      </div>
      <div class="diff-toggle-row">${diffChips}</div>
    </div>
    <div class="panel" style="padding:0">
      <div class="table-wrap">
        <table class="score-table">
          <thead><tr><th style="width:300px">楽曲</th><th>難易度</th><th>Lv</th><th>クリア</th><th>ハイスコア</th><th>EXスコア</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${filtered.length===0?`<div class="empty-state">条件に一致する楽曲がありません</div>`:""}
      </div>
    </div>
    ${filtered.length > visible.length ? `<div class="show-more"><button class="btn secondary" onclick="showMore()">さらに表示（残り ${filtered.length-visible.length}件）</button></div>` : ""}
    <p class="footnote">${filtered.length} / ${merged.length} 件を表示中</p>
  `;

  // re-apply select values (rebuilt via innerHTML, so set again post-render to be safe)
  const minSel = document.querySelectorAll('.select-input')[0];
  const maxSel = document.querySelectorAll('.select-input')[1];
  if (minSel) minSel.value = filters.levelMin;
  if (maxSel) maxSel.value = filters.levelMax;
  const sInput=document.querySelector('.search-input');
  if(sInput){const active=document.activeElement===sInput;sInput.value=filters.search;if(active){sInput.focus();sInput.setSelectionRange(filters.search.length,filters.search.length);}}
}

/* loadAll() はログイン確認後、下部のFirebase用scriptから呼び出す */
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYjKFgJljrrbrDi0xbTdJxH4p7HobDznw",
  authDomain: "ex-score-tool.firebaseapp.com",
  projectId: "ex-score-tool",
  storageBucket: "ex-score-tool.firebasestorage.app",
  messagingSenderId: "941719335618",
  appId: "1:941719335618:web:b602dfe45701dec852c15b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const FAKE_EMAIL_SUFFIX = "@voltlog.local";
function usernameToEmail(username) {
  return username.trim().toLowerCase() + FAKE_EMAIL_SUFFIX;
}
function validateUsername(u) {
  return /^[a-zA-Z0-9_]{3,20}$/.test(u);
}
function mapAuthError(e) {
  switch (e.code) {
    case "auth/email-already-in-use": return "そのアカウント名は既に使われています";
    case "auth/weak-password": return "パスワードは6文字以上にしてください";
    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found": return "アカウント名またはパスワードが違います";
    case "auth/invalid-email": return "アカウント名に使える文字を確認してください";
    default: return "エラーが発生しました: " + e.message;
  }
}

let authMode = "login";
function renderAuthGate() {
  document.getElementById('authTitle').textContent = authMode === "login" ? "ログイン" : "新規登録";
  document.getElementById('authSubmitBtn').textContent = authMode === "login" ? "ログイン" : "登録する";
  document.querySelector('#authGate .btn.secondary').textContent = authMode === "login" ? "新規登録はこちら" : "ログインはこちら";
  document.getElementById('authError').textContent = "";
}
window.toggleAuthMode = function () {
  authMode = authMode === "login" ? "signup" : "login";
  renderAuthGate();
};

window.handleAuthSubmit = async function () {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = "";

  if (!validateUsername(username)) {
    errEl.textContent = "アカウント名は半角英数字とアンダースコアで3〜20文字にしてください";
    return;
  }
  if (!password || password.length < 6) {
    errEl.textContent = "パスワードは6文字以上で入力してください";
    return;
  }

  const email = usernameToEmail(username);
  try {
    if (authMode === "signup") {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, "users", cred.user.uid), {
        username, createdAt: serverTimestamp(), scores: {}
      });
      await setDoc(doc(db, "usernames", username.toLowerCase()), { uid: cred.user.uid });
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (e) {
    errEl.textContent = mapAuthError(e);
  }
};

window.handleLogout = function () {
  signOut(auth);
};

window.saveScoresToFirestore = async function (scores) {
  if (!auth.currentUser) throw new Error("ログインしていません");
  await setDoc(doc(db, "users", auth.currentUser.uid), { scores }, { merge: true });
};

window.loadScoresFromFirestore = async function () {
  if (!auth.currentUser) return {};
  const snap = await getDoc(doc(db, "users", auth.currentUser.uid));
  return snap.exists() ? (snap.data().scores || {}) : {};
};

onAuthStateChanged(auth, async (user) => {
  if (user) {
    let username = "";
    try {
      const snap = await getDoc(doc(db, "users", user.uid));
      username = snap.exists() ? (snap.data().username || "") : "";
    } catch (e) {
      console.error("ユーザー情報の取得に失敗:", e);
    }
    document.getElementById('authGate').style.display = 'none';
    document.getElementById('appRoot').style.display = 'block';
    document.getElementById('authUserLabel').textContent = username ? (username + " でログイン中") : "";
    window.loadAll();
  } else {
    document.getElementById('appRoot').style.display = 'none';
    document.getElementById('authGate').style.display = 'block';
  }
});

renderAuthGate();
</script>
</body>
</html>
