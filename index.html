<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>○○ - SDVX EX-Score Tool</title>
<style>
  :root {
    --bg: #f4f5f9;
    --bg-glow: #e9edfa;
    --panel: #ffffff;
    --panel-2: #f0f2f8;
    --border: #dde1ec;
    --text: #1a1f2e;
    --muted: #6b7280;
    --row-border: rgba(0,0,0,0.06);
    --row-hover: rgba(0,0,0,0.03);
    --dim-bg: rgba(0,0,0,0.035);
    --cyan: #0891a8;
    --magenta: #c81f74;
    --gold: #b8860b;
    --nov: #33409E; --adv: #CA8A04; --exh: #DC2626; --inf: #C2478A;
    --mxm: #374151; --grv: #9A3412; --hvn: #0284C7; --vvd: #A61155;
    --xcd: #1E3FA8; --nbl: #0F6B31; --ult: #78350F;
  }
  [data-theme="dark"] {
    --bg: #05070d;
    --bg-glow: #0d1830;
    --panel: #10141f;
    --panel-2: #161c2c;
    --border: #232b40;
    --text: #e7ecf7;
    --muted: #7a84a0;
    --row-border: rgba(255,255,255,0.04);
    --row-hover: rgba(255,255,255,0.02);
    --dim-bg: rgba(255,255,255,0.03);
    --cyan: #00e5ff;
    --magenta: #ff2e9a;
    --gold: #ffd23f;
    --nov: #6B7FE0; --adv: #FFC93C; --exh: #FF4757; --inf: #FFA6D9;
    --mxm: #8B94AC; --grv: #D2691E; --hvn: #38BDF8; --vvd: #FF5FAE;
    --xcd: #3D6FFF; --nbl: #16A34A; --ult: #D4AF37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 15% -10%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text); font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    min-height: 100vh; padding: 20px;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:18px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark {
    width:40px; height:40px; border-radius:10px; background: linear-gradient(135deg, var(--cyan), var(--magenta));
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:16px; color:#05070d;
    box-shadow: 0 0 22px rgba(0,229,255,0.35); flex-shrink:0;
  }
  .brand-title {
    font-size:20px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
    background: linear-gradient(90deg, var(--cyan), var(--magenta)); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand-sub { font-size:11px; color:var(--muted); letter-spacing:0.5px; margin-top:2px; }
  .account-menu-wrap { position:relative; }
  .account-avatar {
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background: #4361EE; color:#ffffff;
    font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center;
  }
  .account-dropdown {
    position:absolute; top:48px; right:0; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:6px; min-width:190px; box-shadow:0 8px 24px rgba(0,0,0,0.25); z-index:60;
  }
  .account-dropdown-name { font-size:12px; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--border); margin-bottom:4px; }
  .account-dropdown-item {
    display:block; width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:9px 10px; font-size:13px; border-radius:7px; cursor:pointer;
  }
  .account-dropdown-item:hover { background:var(--panel-2); }
  .account-dropdown-item.danger { color:#ff4757; }
  .stats-row { display:flex; gap:10px; flex-wrap:wrap; }
  .stat-chip { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px 14px; min-width:78px; text-align:center; }
  .stat-chip-value { font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat-chip-label { font-size:10px; color:var(--muted); margin-top:2px; letter-spacing:0.5px; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--border); }
  .tab-btn {
    background:none; border:none; color:var(--muted); font-size:13px; font-weight:700; padding:10px 16px;
    cursor:pointer; letter-spacing:0.5px; position:relative; top:1px; border-bottom:2px solid transparent;
  }
  .tab-btn.active { color:var(--text); border-bottom:2px solid var(--cyan); }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .panel h3 { margin:0 0 10px; font-size:14px; letter-spacing:0.5px; }
  .hint { color:var(--muted); font-size:12px; margin:4px 0 10px; line-height:1.6; }
  .filter-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .search-input, .select-input { background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 10px; font-size:13px; outline:none; }
  .search-input { flex:1; min-width:160px; }
  @media (max-width: 480px) {
    .search-input { flex-basis:100%; }
  }
  .diff-toggle-row { display:flex; gap:6px; flex-wrap:wrap; }
  .diff-toggle { border:1px solid var(--border); border-radius:7px; padding:4px 9px; font-size:11px; font-weight:700; cursor:pointer; background:var(--panel-2); color:var(--muted); }
  .diff-toggle.on { color:#05070d; }
  textarea.data-input { width:100%; min-height:110px; background:var(--panel-2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px; font-size:12px; font-family:ui-monospace,"SF Mono",monospace; resize:vertical; }
  .btn { background: linear-gradient(135deg, var(--cyan), #00a8c2); color:#05070d; border:none; border-radius:8px; padding:9px 18px; font-weight:800; font-size:13px; cursor:pointer; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn.secondary { background:var(--panel-2); color:var(--text); border:1px solid var(--border); }
  .btn.danger { background:rgba(255,71,87,0.15); color:#ff4757; border:1px solid rgba(255,71,87,0.4); }
  .btn-row { display:flex; gap:8px; margin-top:10px; }
  .unmatched-box { margin-top:10px; font-size:11px; color:var(--muted); }
  .unmatched-box ul { margin:6px 0 0; padding-left:18px; max-height:140px; overflow:auto; }
  table.score-table { width:100%; border-collapse:collapse; font-size:13px; }
  table.score-table th {
    text-align:left; color:var(--muted); font-size:11px; font-weight:700; padding:8px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--panel); z-index:1;
  }
  table.score-table td { padding:7px 8px; border-bottom:1px solid var(--row-border); vertical-align:middle; }
  table.score-table tr.unplayed { opacity:0.55; }
  table.score-table tr:hover td { background:var(--row-hover); }
  .jacket-thumb { width:34px; height:34px; border-radius:6px; object-fit:cover; background:#1c2338; flex-shrink:0; }
  .title-cell { display:flex; align-items:center; gap:10px; max-width:340px; }
  .title-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .level-num { font-variant-numeric:tabular-nums; font-weight:700; color:var(--muted); }
  .mono { font-family:ui-monospace,"SF Mono",monospace; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:800; border:1px solid; letter-spacing:0.3px; }
  .badge-dim { color:var(--muted); background:var(--dim-bg); border-color:var(--border); }
  .empty-state { text-align:center; padding:50px 20px; color:var(--muted); }
  .empty-state .big { font-size:15px; color:var(--text); margin-bottom:6px; font-weight:700; }
  .toast {
    position:fixed; bottom:20px; right:20px; padding:12px 18px; border-radius:10px; font-size:13px; font-weight:600;
    z-index:50; box-shadow:0 8px 24px rgba(0,0,0,0.4); display:none;
  }
  .toast.success { background:#14261d; color:#5fe0a0; border:1px solid #5fe0a0; }
  .toast.error { background:#2a1620; color:#ff4757; border:1px solid #ff4757; }
  .show-more { text-align:center; margin-top:12px; }
  .footnote { font-size:11px; color:var(--muted); text-align:center; margin-top:18px; }

  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-box {
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    width:100%; max-width:520px; max-height:85vh; display:flex; flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .modal-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; border-bottom:1px solid var(--border);
  }
  .modal-header h3 { margin:0; font-size:15px; }
  .modal-close { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1; padding:2px 6px; }
  .modal-close:hover { color:var(--text); }
  .modal-body { padding:16px 18px; overflow-y:auto; flex:1; }
  .modal-footer { padding:14px 18px; border-top:1px solid var(--border); display:flex; justify-content:center; }
  .modal-footer .btn { width:50%; min-width:200px; white-space:nowrap; }
  .filter-section { margin-bottom:18px; }
  .filter-section h4 { margin:0 0 8px; font-size:13px; color:var(--text); }
  .filter-band { margin-bottom:14px; }
  .filter-band-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .filter-band-label { font-size:12px; color:var(--muted); font-weight:700; }
  .filter-band-actions { display:flex; gap:10px; }
  .link-btn { background:none; border:none; color:var(--cyan); font-size:11px; cursor:pointer; padding:0; }
  .link-btn:hover { text-decoration:underline; }
  .check-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .check-item {
    display:flex; align-items:center; gap:5px; background:var(--panel-2); border:1px solid var(--border);
    border-radius:7px; padding:5px 9px; font-size:12px; cursor:pointer;
  }
  .check-item input { margin:0; cursor:pointer; }
  .toggle-group { display:flex; gap:8px; flex-wrap:wrap; }
  .toggle-pill {
    border:1px solid var(--border); border-radius:20px; padding:7px 16px; font-size:12px; font-weight:700;
    cursor:pointer; background:var(--panel-2); color:var(--muted);
  }
  .toggle-pill.on { background:var(--cyan); border-color:var(--cyan); color:#05070d; }
  .badge-filled {
    display:inline-block; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:800;
    color:#ffffff; letter-spacing:0.3px;
  }
  .table-wrap { max-height:58vh; overflow:auto; }
</style>
</head>
<body>

<div id="authGate" class="panel" style="max-width:360px;margin:60px auto;display:none">
  <h3 id="authTitle">ログイン</h3>
  <p class="hint" id="authHint">アカウント名とパスワードを入力してください。</p>
  <input class="search-input" id="authUsername" placeholder="アカウント名（半角英数字・3〜20文字）" style="width:100%;margin-bottom:8px;box-sizing:border-box;">
  <input class="search-input" id="authPassword" type="password" placeholder="パスワード（6文字以上）" style="width:100%;margin-bottom:4px;box-sizing:border-box;">
  <p class="hint" id="authError" style="color:#ff4757;min-height:16px"></p>
  <div class="btn-row">
    <button class="btn" id="authSubmitBtn" onclick="handleAuthSubmit()">ログイン</button>
    <button class="btn secondary" onclick="toggleAuthMode()">新規登録はこちら</button>
  </div>
</div>

<div id="appRoot" style="display:none">
  <div class="header">
    <div class="brand">
      <div>
        <div class="brand-title">○○</div>
        <div class="brand-sub">SDVX EX-Score Tool</div>
      </div>
    </div>
    <div class="account-menu-wrap">
      <button class="account-avatar" id="accountAvatarBtn" onclick="toggleAccountMenu()">?</button>
      <div class="account-dropdown" id="accountDropdown" style="display:none">
        <div class="account-dropdown-name" id="accountDropdownName"></div>
        <button class="account-dropdown-item" id="themeToggleBtn" onclick="handleToggleTheme()">ダークモードに切り替え</button>
        <button class="account-dropdown-item danger" onclick="handleLogout()">ログアウト</button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-list" onclick="switchTab('list')">スコア一覧</button>
    <button class="tab-btn" id="tab-data" onclick="switchTab('data')">データ管理</button>
    <button class="tab-btn" id="tab-friends" onclick="switchTab('friends')">フレンド</button>
    <button class="tab-btn" id="tab-compare" onclick="switchTab('compare')">比較</button>
  </div>

  <div id="view-list"></div>
  <div id="view-data" style="display:none"></div>
  <div id="view-friends" style="display:none"></div>
  <div id="view-compare" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ------------------------------------------------------------------ */
/* Constants                                                           */
/* ------------------------------------------------------------------ */
const DIFF_META = {
  novice:   { abbr: "NOV", color: "var(--nov)" },
  advanced: { abbr: "ADV", color: "var(--adv)" },
  exhaust:  { abbr: "EXH", color: "var(--exh)" },
  infinite: { abbr: "INF", color: "var(--inf)" },
  maximum:  { abbr: "MXM", color: "var(--mxm)" },
  gravity:  { abbr: "GRV", color: "var(--grv)" },
  heavenly: { abbr: "HVN", color: "var(--hvn)" },
  vivid:    { abbr: "VVD", color: "var(--vvd)" },
  exceed:   { abbr: "XCD", color: "var(--xcd)" },
  nabla:    { abbr: "NBL", color: "var(--nbl)" },
  ultimate: { abbr: "ULT", color: "var(--ult)" },
};
const DIFF_ORDER = ["novice","advanced","exhaust","infinite","maximum","gravity","heavenly","vivid","exceed","nabla","ultimate"];
const GRADE_ORDER = ["D","C","B","A","A+","AA","AA+","AAA","AAA+","S"];
const GRADE_RANK = Object.fromEntries(GRADE_ORDER.map((g,i)=>[g,i]));
const CLEAR_META = {
  "PLAYED":             { label: "PLAYED", color: "#8B93A8" },
  "COMPLETE":           { label: "CLEAR",  color: "#5EC8FF" },
  "EXCESSIVE COMPLETE": { label: "EXC",    color: "#5FE0A0" },
  "MAXXIVE COMPLETE":   { label: "MXC",    color: "#2FE6C8" },
  "ULTIMATE CHAIN":     { label: "UC",     color: "#C79BFF" },
  "PERFECT":            { label: "PUC",    color: "#FFD23F" },
};

/* ------------------------------------------------------------------ */
/* State                                                                */
/* ------------------------------------------------------------------ */
let songs = [];
let scores = {};
let masterError = null;
let tab = "list";
let visibleCount = 200;
let filters = { search: "", diffs: new Set(DIFF_ORDER), levels: new Set(), status: "all", sort: "level_desc" };
let draftLevels = new Set();
let draftDiffs = new Set();
let friendsState = { loading: false, incoming: [], outgoing: [], friends: [] };
let compareState = { loadingFriends: false, friendsList: [], selectedUid: "", loadingScores: false, friendScores: null };

/* ------------------------------------------------------------------ */
/* Helpers                                                              */
/* ------------------------------------------------------------------ */
function songKey(title, type) { return title + "||" + String(type).toLowerCase(); }
// 公式CSVは曲名中のスペースをノーブレークスペース(U+00A0)で、
// 曲名中の実カンマを全角カンマ(，)で出力してくる仕様があるため、
// マスタ(songs.json)側の表記（半角スペース・半角カンマ）に正規化してから突合する。
function normalizeTitle(raw) {
  return String(raw).trim()
    .replace(/\u00A0/g, " ")
    .replace(/，/g, ",");
}
function fmtNum(n) { return (n === null || n === undefined || isNaN(n)) ? "-" : n.toLocaleString("en-US"); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function showToast(msg, kind) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + kind;
  el.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { el.style.display = 'none'; }, 3200);
}

let currentTheme = "light";
function applyTheme(theme) {
  currentTheme = theme === "dark" ? "dark" : "light";
  document.documentElement.setAttribute('data-theme', currentTheme);
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.textContent = currentTheme === "dark" ? "ライトモードに切り替え" : "ダークモードに切り替え";
}
window.applyTheme = applyTheme;

window.handleToggleTheme = async function () {
  const next = currentTheme === "dark" ? "light" : "dark";
  applyTheme(next);
  try {
    await window.saveThemeToFirestore(next);
  } catch (e) {
    showToast("テーマ設定の保存に失敗しました: " + e.message, "error");
  }
};

window.toggleAccountMenu = function () {
  const dd = document.getElementById('accountDropdown');
  dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
};
document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.account-menu-wrap');
  const dd = document.getElementById('accountDropdown');
  if (wrap && dd && dd.style.display !== 'none' && !wrap.contains(e.target)) {
    dd.style.display = 'none';
  }
});

function parseScoreCsv(text) {
  const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if (lines.length < 2) throw new Error("CSVにデータ行がありません");
  const rows = lines.slice(1);
  const records = {};
  let parsedCount = 0;
  for (const line of rows) {
    const cols = line.split(",");
    if (cols.length < 9) continue;
    const [title, diffRaw, levelRaw, clearRank, grade, highScore, exScore, playCount, clearCount] = cols;
    if (!title || !diffRaw) continue;
    const type = diffRaw.trim().toLowerCase();
    const normalizedTitle = normalizeTitle(title);
    const key = songKey(normalizedTitle, type);
    records[key] = {
      title: normalizedTitle, type,
      clearRank: (clearRank || "").trim(),
      grade: (grade || "").trim(),
      highScore: parseInt(highScore, 10) || 0,
      exScore: parseInt(exScore, 10) || 0,
      playCount: parseInt(playCount, 10) || 0,
    };
    parsedCount++;
  }
  return { records, parsedCount };
}

/* ------------------------------------------------------------------ */
/* Data loading                                                         */
/* ------------------------------------------------------------------ */
async function loadAll() {
  try {
    const res = await fetch('./songs.json');
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    songs = data.filter(d => d && d.title && d.type).map(d => ({
      key: d.key || songKey(d.title, d.type),
      title: String(d.title),
      type: String(d.type).toLowerCase(),
      level: typeof d.level === "number" ? d.level : parseFloat(d.level),
      jacket: d.jacket || "",
      reading: d.reading || "",
      maxExScore: Number(d.max_exscore)||0,
    }));
  } catch (e) {
    masterError = "楽曲マスタ(songs.json)の読み込みに失敗しました: " + e.message +
      "。index.html と同じフォルダに songs.json を置いてデプロイしているか確認してください。";
  }
  try {
    scores = await window.loadScoresFromFirestore();
  } catch (e) {
    scores = {};
    showToast("スコアデータの読み込みに失敗しました: " + e.message, "error");
  }

  filters.levels = new Set(ALL_LEVEL_VALUES);

  render();
}

function distinctLevels() {
  return Array.from(new Set(songs.map(s => s.level).filter(n => !isNaN(n)))).sort((a,b) => a - b);
}

/* ------------------------------------------------------------------ */
/* Actions                                                              */
/* ------------------------------------------------------------------ */
function switchTab(t) {
  tab = t;
  ['list', 'data', 'friends', 'compare'].forEach(name => {
    document.getElementById('tab-' + name).className = 'tab-btn' + (t === name ? ' active' : '');
    document.getElementById('view-' + name).style.display = t === name ? 'block' : 'none';
  });
  render();
  if (t === 'friends') refreshFriendsData();
  if (t === 'compare') refreshCompareFriends();
}

async function refreshCompareFriends() {
  compareState.loadingFriends = true;
  render();
  try {
    compareState.friendsList = await window.getFriends();
  } catch (e) {
    showToast("フレンド一覧の取得に失敗しました: " + e.message, "error");
  }
  compareState.loadingFriends = false;
  render();
}

function handleSelectCompareFriend(uid) {
  compareState.selectedUid = uid;
  compareState.friendScores = null;
  render();
  if (uid) loadCompareFriendScores(uid);
}

async function loadCompareFriendScores(uid) {
  compareState.loadingScores = true;
  render();
  try {
    compareState.friendScores = await window.getUserScores(uid);
  } catch (e) {
    showToast("相手のスコア取得に失敗しました: " + e.message, "error");
    compareState.friendScores = {};
  }
  compareState.loadingScores = false;
  render();
}

async function refreshFriendsData() {
  friendsState.loading = true;
  render();
  try {
    const [incoming, outgoing, friends] = await Promise.all([
      window.getIncomingFriendRequests(),
      window.getOutgoingFriendRequests(),
      window.getFriends(),
    ]);
    friendsState.incoming = incoming;
    friendsState.outgoing = outgoing;
    friendsState.friends = friends;
  } catch (e) {
    showToast("フレンド情報の取得に失敗しました: " + e.message, "error");
  }
  friendsState.loading = false;
  render();

async function handleSendFriendRequest() {
  const input = document.getElementById('friendUsernameInput');
  const username = input.value.trim();
  if (!username) { showToast("ユーザー名を入力してください", "error"); return; }
  try {
    await window.sendFriendRequest(username);
    input.value = "";
    showToast("フレンド申請を送りました", "success");
    refreshFriendsData();
  } catch (e) {
    showToast(e.message, "error");
  }
}

async function handleRespondRequest(id, accept) {
  try {
    await window.respondFriendRequest(id, accept);
    showToast(accept ? "フレンドになりました" : "申請を拒否しました", "success");
    refreshFriendsData();
  } catch (e) {
    showToast("処理に失敗しました: " + e.message, "error");
  }
}

async function handleImportCsv() {
  const ta = document.getElementById('csvInput');
  const text = ta.value;
  if (!text.trim()) { showToast("CSVを貼り付けてください", "error"); return; }
  try {
    const { records, parsedCount } = parseScoreCsv(text);
    const masterKeys = new Set(songs.map(s => songKey(s.title, s.type)));
    let matched = 0, unmatched = 0;
    const unmatchedTitles = [];
    for (const key of Object.keys(records)) {
      if (masterKeys.has(key)) matched++;
      else { unmatched++; if (unmatchedTitles.length < 30) unmatchedTitles.push(records[key].title + " / " + records[key].type); }
    }
    const merged = Object.assign({}, scores, records);
    await window.saveScoresToFirestore(merged);
    scores = merged;
    ta.value = "";
    showToast(`スコアを取り込みました（${parsedCount}件, マスタ一致 ${matched}件）`, "success");
    window._lastImportInfo = { parsedCount, matched, unmatched, unmatchedTitles };
    render();
  } catch (e) {
    showToast("取り込みに失敗しました: " + e.message, "error");
  }
}

async function handleClearScores() {
  if (!confirm("自分のスコアデータを全て削除しますか？この操作は取り消せません。")) return;
  try {
    await window.saveScoresToFirestore({});
    scores = {};
    showToast("スコアデータを削除しました", "success");
    render();
  } catch (e) {
    showToast("削除に失敗しました: " + e.message, "error");
  }
}

/* ------------------------------------------------------------------ */
/* Derived data                                                         */
/* ------------------------------------------------------------------ */
function getMerged() {
  return songs.map(s => {
    const key = songKey(s.title, s.type);
    return Object.assign({}, s, { key, score: scores[key] || null });
  });
}

function getStats(merged) {
  const total = merged.length;
  const played = merged.filter(m => m.score).length;
  const sCount = merged.filter(m => m.score && m.score.grade === "S").length;
  const pucCount = merged.filter(m => m.score && m.score.clearRank === "PERFECT").length;
  return { total, played, sCount, pucCount };
}

function getFiltered(merged) {
  let list = merged.filter(m => filters.diffs.has(m.type) && filters.levels.has(m.level));
  if (filters.search.trim()) {
    const q = filters.search.trim().toLowerCase();
    list = list.filter(m => m.title.toLowerCase().includes(q) || (m.reading || "").includes(q));
  }
  if (filters.status === "unplayed") list = list.filter(m => !m.score);
  else if (filters.status === "played") list = list.filter(m => !!m.score);

  const cmp = {
    level_desc: (a,b) => b.level - a.level || a.title.localeCompare(b.title),
    level_asc:  (a,b) => a.level - b.level || a.title.localeCompare(b.title),
    title_asc:  (a,b) => (a.reading||a.title).localeCompare(b.reading||b.title, "ja"),
    title_desc: (a,b) => (b.reading||b.title).localeCompare(a.reading||a.title, "ja"),
    score_desc: (a,b) => (b.score?.highScore||-1) - (a.score?.highScore||-1),
    score_asc:  (a,b) => (a.score?a.score.highScore:Infinity) - (b.score?b.score.highScore:Infinity),
  }[filters.sort] || (() => 0);
  return list.slice().sort(cmp);
}

function buildDecimalRange(start, end, step) {
  const out = [];
  for (let v = start; v <= end + 1e-9; v += step) out.push(Math.round(v * 10) / 10);
  return out;
}

    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found": return "アカウント名またはパスワードが違います";
    case "auth/invalid-email": return "アカウント名に使える文字を確認してください";
    default: return "エラーが発生しました: " + e.message;
  }
}

let authMode = "login";
function renderAuthGate() {
  document.getElementById('authTitle').textContent = authMode === "login" ? "ログイン" : "新規登録";
  document.getElementById('authSubmitBtn').textContent = authMode === "login" ? "ログイン" : "登録する";
  document.querySelector('#authGate .btn.secondary').textContent = authMode === "login" ? "新規登録はこちら" : "ログインはこちら";
  document.getElementById('authError').textContent = "";
}
window.toggleAuthMode = function () {
  authMode = authMode === "login" ? "signup" : "login";
  renderAuthGate();
};

window.handleAuthSubmit = async function () {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = "";

  if (!validateUsername(username)) {
    errEl.textContent = "アカウント名は半角英数字とアンダースコアで3〜20文字にしてください";
    return;
  }
  if (!password || password.length < 6) {
    errEl.textContent = "パスワードは6文字以上で入力してください";
    return;
  }

  const email = usernameToEmail(username);
  try {
    if (authMode === "signup") {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, "users", cred.user.uid), {
        username, createdAt: serverTimestamp(), scores: {}
      });
      await setDoc(doc(db, "usernames", username.toLowerCase()), { uid: cred.user.uid });
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (e) {
    errEl.textContent = mapAuthError(e);
  }
};

window.handleLogout = function () {
  if (!confirm("ログアウトしますか？")) return;
  signOut(auth);
};

window.saveScoresToFirestore = async function (scores) {
  if (!auth.currentUser) throw new Error("ログインしていません");
  await setDoc(doc(db, "users", auth.currentUser.uid), { scores }, { merge: true });
};

window.loadScoresFromFirestore = async function () {
  if (!auth.currentUser) return {};
  const snap = await getDoc(doc(db, "users", auth.currentUser.uid));
  return snap.exists() ? (snap.data().scores || {}) : {};
};

function sortedId(a, b) {
  return a < b ? a + "_" + b : b + "_" + a;
}

window.sendFriendRequest = async function (targetUsernameRaw) {
  if (!auth.currentUser) throw new Error("ログインしていません");
  const myUid = auth.currentUser.uid;
  const targetUsername = targetUsernameRaw.trim().toLowerCase();
  if (!targetUsername) throw new Error("ユーザー名を入力してください");

  const mySnap = await getDoc(doc(db, "users", myUid));
  const myUsername = mySnap.exists() ? mySnap.data().username : "";
  if (targetUsername === (myUsername || "").toLowerCase()) {
    throw new Error("自分自身には申請できません");
  }

  const unameSnap = await getDoc(doc(db, "usernames", targetUsername));
  if (!unameSnap.exists()) throw new Error("そのアカウント名は見つかりません");
  const targetUid = unameSnap.data().uid;

  const id = sortedId(myUid, targetUid);
  const reqRef = doc(db, "friendRequests", id);

  try {
    await setDoc(reqRef, {
      fromUid: myUid,
      toUid: targetUid,
      fromUsername: myUsername,
      toUsername: targetUsernameRaw.trim(),
      status: "pending",
      createdAt: serverTimestamp(),
    });
  } catch (e) {
    if (e.code === "permission-denied") {
      throw new Error("すでに申請済み、フレンド、または過去に拒否されている可能性があります");
    }
    throw e;
  }
};

window.getIncomingFriendRequests = async function () {
  const myUid = auth.currentUser.uid;
  const q = query(collection(db, "friendRequests"), where("toUid", "==", myUid), where("status", "==", "pending"));
  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
};

window.getOutgoingFriendRequests = async function () {
  const myUid = auth.currentUser.uid;
  const q = query(collection(db, "friendRequests"), where("fromUid", "==", myUid), where("status", "==", "pending"));
  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
};

window.getFriends = async function () {
  const myUid = auth.currentUser.uid;
  const q1 = query(collection(db, "friendRequests"), where("fromUid", "==", myUid), where("status", "==", "accepted"));
  const q2 = query(collection(db, "friendRequests"), where("toUid", "==", myUid), where("status", "==", "accepted"));
  const [s1, s2] = await Promise.all([getDocs(q1), getDocs(q2)]);
  const friends = [];
  s1.forEach(d => { const data = d.data(); friends.push({ uid: data.toUid, username: data.toUsername }); });
  s2.forEach(d => { const data = d.data(); friends.push({ uid: data.fromUid, username: data.fromUsername }); });
  return friends;
};

window.respondFriendRequest = async function (id, accept) {
  const reqRef = doc(db, "friendRequests", id);
  await updateDoc(reqRef, { status: accept ? "accepted" : "rejected" });
};

window.getUserScores = async function (uid) {
  const snap = await getDoc(doc(db, "users", uid));
  return snap.exists() ? (snap.data().scores || {}) : {};
};

window.saveThemeToFirestore = async function (theme) {
  if (!auth.currentUser) return;
  await setDoc(doc(db, "users", auth.currentUser.uid), { theme }, { merge: true });
};

onAuthStateChanged(auth, async (user) => {
  if (user) {
    let username = "";
    let theme = "light";
    try {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) {
        username = snap.data().username || "";
        theme = snap.data().theme || "light";
      }
    } catch (e) {
      console.error("ユーザー情報の取得に失敗:", e);
    }
    window.applyTheme(theme);
    document.getElementById('authGate').style.display = 'none';
    document.getElementById('appRoot').style.display = 'block';
    document.getElementById('accountDropdownName').textContent = username ? (username + " でログイン中") : "";
    document.getElementById('accountAvatarBtn').textContent = username ? username.charAt(0).toUpperCase() : "?";
    window.loadAll();
  } else {
    window.applyTheme("light");
    document.getElementById('appRoot').style.display = 'none';
    document.getElementById('authGate').style.display = 'block';
  }
});

renderAuthGate();
</script>
